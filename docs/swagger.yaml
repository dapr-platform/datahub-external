      error_msg:
        description: 错误信息
        type: string
      id:
        description: 记录ID（使用时间戳生成）
        type: string
      record_count:
        description: 处理记录数
        type: integer
      start_time:
        description: 开始时间
        type: string
      status:
        allOf:

        type: string
      HotelCode:
        description: 酒店代码
        type: string
      HotelName:
        description: 酒店名称
        type: string
      Id:
        description: 绿云系统ID(唯一主键)
        type: integer
      Mobile:
        description: 手机号
        type: string
      NAME:
        description: 姓名
        type: string
      Remark:
        description: 备注
        type: string
      Rmno:
        description: 房间号
        type: string
      TaCode:

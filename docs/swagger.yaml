        description: 执行状态
      task_type:
        description: 任务类型（reservations/positions-inc等）
        type: string
    type: object
  proxy.TaskStatus:
    enum:
    - running
    - success
    - failed
    type: string
    x-enum-comments:
      TaskStatusFailed: 失败
      TaskStatusRunning: 执行中
      TaskStatusSuccess: 成功
    x-enum-descriptions:
    - 执行中
    - 成功
    - 失败
    x-enum-varnames:
    - TaskStatusRunning
    - TaskStatusSuccess
    - TaskStatusFailed
info:
  contact: {}
  description: 代理第三方数据接口，如绿云酒店管理系统等
  title: 数据底座外部接口代理服务 API
  version: "1.0"
paths:
  /datasources:
    get:
      consumes:
      - application/json
      description: 返回所有已注册的第三方数据源信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controllers.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/proxy.ClientInfo'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 列出所有数据源
      tags:
      - 数据源
  /health:
    get:
      consumes:
      - application/json
      description: 检查服务是否运行
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 健康检查
      tags:
      - 健康检查
  /lvyun/business-report:
    get:
      consumes:
      - application/json
      description: 获取营业日报表数据，包括代码、描述、本日发生、本月发生、本年发生等
      parameters:
      - description: 酒店代码
        in: query
        name: hotel_code
        required: true
        type: string
      - description: '开始日期 (格式: 2022-10-20 00:00:00)'
        in: query
        name: start_date
        required: true
        type: string
      - description: '结束日期 (格式: 2022-10-21 00:00:00)'
        in: query
        name: end_date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controllers.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/lvyun.BusinessReportResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: 营业报表数据
      tags:
      - 绿云接口
  /lvyun/checkouts:
    get:
      consumes:
      - application/json
      description: 获取结账单流水数据，包括结账流水号、账号、入账类型、入账代码、金额等
      parameters:
      - description: 酒店代码
        in: query
        name: hotel_code
        required: true
        type: string
      - description: '营业日期 (格式: 2025-10-20 00:00:00)'
        in: query
        name: biz_date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controllers.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/lvyun.CheckoutResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: 结账单数据
      tags:
      - 绿云接口
  /lvyun/health:
    get:
      consumes:
      - application/json
      description: 检查绿云接口连接状态
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: 绿云接口健康检查
      tags:
      - 绿云接口
  /lvyun/info:
    get:
